{% extends "base.html" %}
{% block title %}Error del servidor | {{ site_name }}{% endblock %}
{% block content %}
<section class="error-page">
  <div class="container error-inner" data-reveal>
    <span class="error-code">500</span>
    <h1>Algo se rompió<br><span class="gradient-text">detrás del escenario.</span></h1>
    <p>Ocurrió un error inesperado. Ya quedó registrado para poder revisarlo. Podés intentar de nuevo en unos segundos.</p>
    <div class="error-actions">
      <a class="btn btn-primary" href="{{ url_for('public.inicio') }}"><i class="fa-solid fa-rotate-right"></i> Reintentar</a>
    </div>
  </div>
</section>
{% endblock %}
